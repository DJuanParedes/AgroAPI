server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/agrosierra;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      fail-on-unknown-properties: false
agro:
  jwt-secret: ${JWT_SECRET:}
